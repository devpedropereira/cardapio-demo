<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E4D3B">
<title>Cardápio online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/*
  Cardápio online — demo comercial.
  Tudo que muda de um cliente para outro está no objeto RESTAURANTE (no <script> lá embaixo).
  Cores vêm de RESTAURANTE.cores e são aplicadas nestas variáveis.
*/
:root{
  --brand:#1E4D3B; --brand-ink:#FFFFFF; --brand-soft:#E4EEE9;
  --promo:#B4561B; --promo-soft:#FBEADF;
  --bg:#F6F3EE; --surface:#FFFFFF; --ink:#211E1A; --muted:#6B655D; --line:#E7E1D8;
  --ok:#1D7A45; --ok-soft:#E1F3E8; --warn:#9A3B12;
  --radius:16px; --radius-sm:12px;
  --shadow:0 1px 2px rgba(33,30,26,.06),0 8px 24px rgba(33,30,26,.07);
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sticky-h:116px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--promo);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.wrap{max-width:1080px;margin-inline:auto;padding-inline:16px}
.icon{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Faixa de demonstração */
.demo-flag{background:var(--ink);color:#F3EEE6;font-size:.78rem;text-align:center;padding:6px 12px;letter-spacing:.02em}

/* ---------- HERO ---------- */
.hero{position:relative}
.cover{height:220px;background:linear-gradient(135deg,var(--brand),#3b6b57) center/cover no-repeat;position:relative}
.cover img{width:100%;height:100%;object-fit:cover}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 40%,rgba(0,0,0,.45))}
.hero-card{position:relative;margin-top:-56px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:52px 18px 18px}
.logo{position:absolute;top:-44px;left:18px;width:88px;height:88px;border-radius:22px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:700 2rem var(--f-display);border:4px solid var(--surface);box-shadow:var(--shadow);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.status.fechado{background:#EFECE7;color:var(--muted)}
.hero h1{font:700 clamp(1.7rem,6vw,2.4rem)/1.1 var(--f-display);margin:6px 0 6px;letter-spacing:-.01em;text-wrap:balance}
.hero .desc{color:var(--muted);margin:0 0 12px;max-width:60ch}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.92rem;color:var(--muted);align-items:center}
.meta .nota{color:var(--ink);font-weight:700;display:inline-flex;align-items:center;gap:4px}
.meta .nota svg{fill:#E7A321;stroke:#E7A321;width:16px;height:16px}
.meta span{display:inline-flex;align-items:center;gap:6px}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:600;font-size:.92rem;text-decoration:none;min-height:42px}
.btn:hover{border-color:#cfc6b9}
.btn.primario{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primario:hover{filter:brightness(1.08)}

/* ---------- BUSCA + CATEGORIAS (sticky) ---------- */
.sticky{position:sticky;top:0;z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);margin-top:18px}
.busca{position:relative;padding-top:12px}
.busca svg{position:absolute;left:14px;top:calc(12px + 13px);color:var(--muted)}
.busca input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 40px 12px 42px;font-size:1rem;min-height:46px}
.busca input::placeholder{color:#766e65}
.busca .limpar{position:absolute;right:6px;top:calc(12px + 5px);width:36px;height:36px;border:0;background:none;border-radius:10px;color:var(--muted);display:grid;place-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.9rem;white-space:nowrap;min-height:38px}
.chip[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- CONTEÚDO ---------- */
main{padding-bottom:120px}
.bloco{scroll-margin-top:calc(var(--sticky-h) + 12px);padding-top:26px}
.bloco > h2{font:700 1.35rem/1.2 var(--f-display);margin:0 0 4px}
.bloco > .sub{color:var(--muted);font-size:.9rem;margin:0 0 14px}

/* Combo da semana */
.combo{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 12px 16px;margin-top:22px;position:relative;overflow:hidden}
.combo > div:last-child{padding:0 4px}
.combo .foto{width:100%;height:170px;border-radius:12px;overflow:hidden;background:var(--promo-soft);position:relative}
.combo .foto::after{content:"Oferta";position:absolute;top:10px;left:10px;background:var(--promo);color:#fff;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.combo .foto img{width:100%;height:100%;object-fit:cover}
.combo .rotulo{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--promo);margin-bottom:2px}
.combo h3{font:700 1.15rem/1.2 var(--f-display);margin:0 0 4px}
.combo p{margin:0 0 8px;color:var(--muted);font-size:.9rem}
.combo .linha-preco{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* Mais pedidos (carrossel) */
.carrossel{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(156px,42%);gap:12px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.card{scroll-snap-align:start;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;position:relative}
.card .foto{aspect-ratio:4/3;background:var(--brand-soft);position:relative}
.card .foto img{width:100%;height:100%;object-fit:cover}
.card .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h3{font-size:.98rem;font-weight:600;margin:0;line-height:1.25}
.card .preco{margin-top:auto}
.card .ctrl{position:absolute;right:8px;top:8px}

/* Seções de categoria */
.lista{display:grid;gap:12px}
.prod{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:start;background:var(--surface);border-radius:var(--radius);padding:14px;box-shadow:0 1px 2px rgba(33,30,26,.05);border:1px solid #EFEAE2}
.prod h3{font-size:1.02rem;font-weight:600;margin:0 0 4px;line-height:1.3}
.prod .desc{margin:0 0 8px;color:var(--muted);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod-lado{position:relative;align-self:center}
.prod-lado .foto{width:104px;height:104px;border-radius:12px;overflow:hidden;background:var(--brand-soft)}
.prod-lado .foto img{width:100%;height:100%;object-fit:cover}
.prod-lado.com-foto .ctrl{position:absolute;right:-6px;bottom:-6px}
.ph{width:100%;height:100%;display:grid;place-items:center;font:700 1.6rem var(--f-display);color:var(--brand);background:var(--brand-soft)}

.preco{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.preco strong{font-weight:700;font-variant-numeric:tabular-nums}
.preco s{color:var(--muted);font-size:.86rem;font-variant-numeric:tabular-nums}
.preco .promo{color:var(--promo)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.badges:empty{display:none}
.badge{font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px;background:#F1EDE6;color:#5d564d;line-height:1.3}
.badge.mais-pedido{background:var(--brand-soft);color:var(--brand)}
.badge.novo{background:var(--promo-soft);color:color-mix(in srgb,var(--promo) 78%,#000)}
.badge.vegano,.badge.sem-gluten,.badge.sem-lactose{background:var(--ok-soft);color:var(--ok)}
.badge.oferta{background:var(--promo);color:#fff}

/* Botão adicionar / stepper */
.add{width:40px;height:40px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.add:hover{filter:brightness(1.1)}
.add .icon{width:20px;height:20px;stroke-width:2.5}
.stepper{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.12);height:40px}
.stepper button{width:38px;height:38px;border:0;background:none;display:grid;place-items:center;border-radius:50%;color:var(--brand)}
.stepper button .icon{width:18px;height:18px;stroke-width:2.5}
.stepper output{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.add-largo{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--brand);color:var(--brand-ink);font-weight:700;padding:9px 16px;min-height:42px}

/* Estado vazio da busca */
.vazio{text-align:center;padding:48px 16px;color:var(--muted)}
.vazio strong{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:6px}
.vazio .btn{margin-top:14px}

/* ---------- INFORMAÇÕES ---------- */
.info-grid{display:grid;gap:12px}
.info-card{background:var(--surface);border-radius:var(--radius);padding:16px 18px;border:1px solid #EFEAE2}
.info-card h3{font-size:1rem;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.horarios{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-variant-numeric:tabular-nums}
.horarios li{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px dashed #ECE6DD;font-size:.94rem}
.horarios li:last-child{border-bottom:0}
.horarios li.hoje{font-weight:700}
.horarios li span:last-child{text-align:right}
.horarios li.hoje span:first-child::after{content:"hoje";margin-left:8px;font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--brand-soft);color:var(--brand);vertical-align:2px}
.info-card p{margin:0 0 8px;color:var(--muted);font-size:.94rem}
.info-card a.link{color:var(--brand);font-weight:600;text-decoration:none}
.info-card a.link:hover{text-decoration:underline}
.pagamentos{display:flex;flex-wrap:wrap;gap:6px}
.pagamentos span{font-size:.85rem;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
footer.rodape{text-align:center;color:var(--muted);font-size:.82rem;padding:28px 16px 140px}

/* ---------- BARRA DA SACOLA ---------- */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.barra button{pointer-events:auto;width:100%;max-width:680px;margin-inline:auto;display:flex;align-items:center;gap:12px;border:0;border-radius:16px;background:var(--brand);color:var(--brand-ink);padding:14px 18px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.22);transform:translateY(0);transition:transform .25s ease,opacity .25s ease}
.barra[hidden]{display:block!important}
.barra[hidden] button{transform:translateY(140%);opacity:0;pointer-events:none;visibility:hidden;transition:transform .25s ease,opacity .25s ease,visibility 0s linear .25s}
.barra button span{white-space:nowrap}
.barra .qtd{background:rgba(255,255,255,.18);border-radius:8px;padding:2px 9px;font-variant-numeric:tabular-nums}
@media (max-width:340px){.barra .rotulo{display:none}}
.barra .total{margin-left:auto;font-variant-numeric:tabular-nums}

/* ---------- SACOLA (dialog) ---------- */
dialog.sacola{border:0;padding:0;margin:auto auto 0;width:100%;max-width:100%;max-height:92vh;max-height:92dvh;border-radius:22px 22px 0 0;background:var(--surface);color:var(--ink);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
dialog.sacola::backdrop{background:rgba(25,20,16,.48)}
.sheet{display:flex;flex-direction:column;max-height:92vh;max-height:92dvh}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.sheet header h2{font:700 1.3rem var(--f-display);margin:0}
.fechar{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.sheet-corpo{flex:1;min-height:0;overflow-y:auto;padding:6px 18px 12px;-webkit-overflow-scrolling:touch}
.sheet footer{padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.itens{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid #F0EBE4;align-items:center}
.item .nome{font-weight:600}
.item .unit{color:var(--muted);font-size:.85rem}
.item .acoes-item{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.item .valor{font-weight:700;font-variant-numeric:tabular-nums;min-width:82px;text-align:right}
.remover{border:0;background:none;color:var(--muted);font-size:.82rem;text-decoration:underline;padding:4px 0}
.campo{margin-top:16px}
.campo > label,.campo > .label{display:block;font-weight:600;font-size:.92rem;margin-bottom:6px}
.campo textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:76px;resize:vertical;background:#FDFCFA}
.campo textarea[aria-invalid="true"]{border-color:var(--warn);box-shadow:0 0 0 3px #f6ddd2}
.erro{color:var(--warn);font-size:.85rem;margin-top:6px}
.segmentado{display:grid;grid-template-columns:1fr 1fr;background:#F1EDE6;border-radius:12px;padding:4px;gap:4px}
.segmentado input{position:absolute;opacity:0;pointer-events:none}
.segmentado label{text-align:center;padding:10px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted)}
.segmentado input:checked + label{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.segmentado input:focus-visible + label{outline:3px solid var(--promo);outline-offset:1px}
.resumo{margin-top:18px;display:grid;gap:6px;font-variant-numeric:tabular-nums}
.resumo div{display:flex;justify-content:space-between}
.resumo .total{font-weight:800;font-size:1.1rem;padding-top:8px;border-top:1px solid var(--line)}
.aviso{background:var(--promo-soft);color:#7a3510;border-radius:10px;padding:8px 10px;font-size:.86rem;margin-top:10px}
.enviar{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:14px;background:#15803D;color:#fff;font-weight:700;padding:15px;font-size:1rem;white-space:nowrap}
.enviar:hover{filter:brightness(1.06)}
.nota-envio{text-align:center;color:var(--muted);font-size:.8rem;margin:8px 0 0}
.sacola-vazia{text-align:center;padding:40px 10px 30px;color:var(--muted)}
.sacola-vazia .circulo{width:72px;height:72px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;margin:0 auto 14px}
.sacola-vazia .circulo .icon{width:30px;height:30px}
.sacola-vazia strong{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:4px}

.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:.9rem;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;z-index:40;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- OPÇÕES · DISPONIBILIDADE · ENTREGA · QR ---------- */
.add{position:relative}
.add-n{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--promo);color:#fff;font-size:.72rem;font-weight:700;line-height:16px;text-align:center;border:2px solid var(--surface)}
.indisp{display:inline-block;font-size:.78rem;font-weight:700;padding:7px 11px;border-radius:999px;background:#EFECE7;color:#5d564d;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.indisponivel .foto img{filter:grayscale(1);opacity:.55}
.indisponivel .preco strong,.indisponivel .preco .promo{color:var(--muted)}
.tem-opcoes{cursor:pointer}
.a-partir{font-size:.8rem;color:var(--muted);font-weight:500}
.item .escolhas{font-size:.85rem;color:var(--muted);line-height:1.35;margin-top:2px}
.campo select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px;background:#FDFCFA}
.campo select[aria-invalid="true"]{border-color:var(--warn);box-shadow:0 0 0 3px #f6ddd2}
.enviar:disabled{background:#E7E1D8;color:#5d564d;cursor:not-allowed;filter:none}
.aviso.neutro{background:#EFECE7;color:#4a443d}
.op-foto{height:180px;border-radius:14px;overflow:hidden;background:var(--brand-soft);margin-top:12px}
.op-foto img{width:100%;height:100%;object-fit:cover}
.op-desc{color:var(--muted);margin:12px 0 6px;font-size:.94rem}
.grupo{border:0;margin:20px 0 0;padding:0;min-width:0}
.grupo legend{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;font-weight:700;padding:0 0 6px}
.tag{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;background:#F1EDE6;color:#5d564d;white-space:nowrap}
.tag.obrig{background:var(--ink);color:#fff}
.grupo.invalido .tag.obrig{background:var(--warn)}
.opcao{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid #F0EBE4;cursor:pointer}
.opcao:last-of-type{border-bottom:0}
.opcao input{width:20px;height:20px;margin:0;accent-color:var(--brand);flex:none}
.opcao .extra{margin-left:auto;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.opcao:has(input:disabled){opacity:.5;cursor:not-allowed}
.op-rodape{display:flex;align-items:center;gap:12px}
.op-rodape .stepper{box-shadow:none;flex:none}
.confirmar{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;border-radius:14px;background:var(--brand);color:var(--brand-ink);font-weight:700;padding:14px 18px;font-size:1rem;white-space:nowrap;min-width:0}
.confirmar:hover{filter:brightness(1.08)}
@media (max-width:400px){.op-foto{height:150px}}
@media (max-width:360px){.op-rodape{gap:8px}.op-rodape .stepper button{width:34px}.confirmar{padding:14px 12px;gap:6px}}
.info-card.qr{grid-column:1/-1}
.qr-topo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.qr-topo p{margin:0}
.qr-area{display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px;margin-top:16px}
.qr-area img{width:200px;height:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
.qr-acoes{display:flex;flex-direction:column;gap:10px;min-width:0;flex:1 1 220px}
.qr-acoes .btn{align-self:flex-start}
.qr-url{font-size:.82rem;color:var(--muted);word-break:break-all;margin:0}

/* ---------- DESKTOP ---------- */
@media (min-width:760px){
  .cover{height:300px}
  .hero-card{padding:24px 28px 24px 140px;margin-top:-70px}
  .logo{top:24px;left:24px;width:96px;height:96px}
  .carrossel{grid-auto-columns:200px}
  .lista{grid-template-columns:1fr 1fr}
  .info-grid{grid-template-columns:1.1fr 1fr 1fr}

  // [["Tamanho", "300 ml (+R$ 3,00)"], ...] — só grupos com escolha
  const escolhas = (l, comPreco) => l.sel.map((a, gi) => a.length ? [l.p._grupos[gi].titulo, a.map(i => {
    const it = l.p._grupos[gi].itens[i]; return it.nome + (comPreco && it.preco ? " (+" + brl(it.preco) + ")" : "");
  }).join(", ")] : null).filter(Boolean);
  const precoMin = p => arred(precoDe(p) + p._grupos.reduce((s, g) => s + (g.obrigatorio ? Math.min(...g.itens.map(i => i.preco)) : 0), 0));

  /* ---------- tema ---------- */
  const st = document.documentElement.style, c = R.cores || {};
  if (c.primaria) { st.setProperty("--brand", c.primaria); st.setProperty("--brand-soft", "color-mix(in srgb," + c.primaria + " 12%, #fff)"); }
  if (c.primariaTexto) st.setProperty("--brand-ink", c.primariaTexto);
  if (c.destaque) { st.setProperty("--promo", c.destaque); st.setProperty("--promo-soft", "color-mix(in srgb," + c.destaque + " 14%, #fff)"); }
  if (c.fundo) st.setProperty("--bg", c.fundo);
  if (c.texto) st.setProperty("--ink", c.texto);
  const meta = $('meta[name="theme-color"]'); if (meta && c.primaria) meta.content = c.primaria;
  document.title = "Cardápio · " + R.nome;
  $("#demo-flag").hidden = R.demo === false;

  /* ---------- estado (salvo no navegador) ---------- */
  const versaoCardapio = Number.isInteger(R.versaoCardapio) && R.versaoCardapio > 0 ? R.versaoCardapio : 1;
  const CHAVE = "cardapio:" + slug(R.nome) + ":v" + versaoCardapio;
  let estado = { itens: {}, tipo: "retirada", endereco: "", obs: "", bairro: "" };
  try {
    const s = JSON.parse(localStorage.getItem(CHAVE) || "null");
    if (s && typeof s === "object") estado = Object.assign(estado, { itens: s.itens, tipo: s.tipo, bairro: s.bairro });
  } catch (e) {}
  if (!estado.itens || typeof estado.itens !== "object") estado.itens = {};
  Object.keys(estado.itens).forEach(k => {
    const l = linhaDe(k);
    if (!l || !disponivel(l.p) || !(estado.itens[k] > 0)) delete estado.itens[k]; else estado.itens[k] = Math.min(99, Math.floor(estado.itens[k]));
  });
  if (estado.tipo !== "entrega") estado.tipo = "retirada";
  ["endereco", "obs", "bairro"].forEach(c => { if (typeof estado[c] !== "string") estado[c] = ""; });
  const salvar = () => { try { localStorage.setItem(CHAVE, JSON.stringify({ itens: estado.itens, tipo: estado.tipo, bairro: estado.bairro })); } catch (e) {} };

  /* ---------- imagens com fallback ---------- */
  window.__fotoFalhou = function (img) {
    const ph = document.createElement("div");
    ph.className = "ph"; ph.setAttribute("aria-hidden", "true"); ph.textContent = iniciais(img.alt || R.nome);
    img.replaceWith(ph);
  };
  const imgTag = (src, alt, w, h, eager) => '<img src="' + esc(src) + '" alt="' + esc(alt) + '" width="' + w + '" height="' + h + '"' + (eager ? ' fetchpriority="high"' : ' loading="lazy"') + ' decoding="async" onerror="__fotoFalhou(this)">';

  /* ---------- horário ---------- */
  const minutos = t => { const [h, m] = String(t).split(":").map(Number); return h * 60 + (m || 0); };
  let relogio = null; // usado nos testes para simular dia/hora
  function agora() {
    if (relogio) return relogio;
    try {
      const partes = new Intl.DateTimeFormat("en-US", { timeZone: R.fusoHorario || "America/Sao_Paulo", weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date());
      const v = t => (partes.find(p => p.type === t) || {}).value;
      return { dia: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(v("weekday")), min: (+v("hour") % 24) * 60 + (+v("minute")) };
    } catch (e) { const d = new Date(); return { dia: d.getDay(), min: d.getHours() * 60 + d.getMinutes() }; }
  }
  // Aceita ["07:00","19:00"] ou vários intervalos [["11:00","15:00"], ["18:00","23:00"]].
  function intervalos(d) {
    const h = R.horario && R.horario[d];
    if (!Array.isArray(h) || !h.length) return [];
    return (Array.isArray(h[0]) ? h : [h]).filter(x => Array.isArray(x) && x.length >= 2).map(x => {
      const ini = minutos(x[0]); let fim = minutos(x[1]); if (fim <= ini) fim += 1440; // passa da meia-noite
      return { a: x[0], b: x[1], ini, fim };
    }).sort((x, y) => x.ini - y.ini);
  }
  const faixas = (d, sep) => intervalos(d).map(iv => iv.a + sep + iv.b);
  function status() {
    const a = agora(), ontem = (a.dia + 6) % 7;
    const aberto = intervalos(a.dia).find(iv => a.min >= iv.ini && a.min < iv.fim) || intervalos(ontem).find(iv => a.min + 1440 < iv.fim);
    if (aberto) return { aberto: true, texto: "Aberto agora · até " + aberto.b, abre: "", dia: a.dia };
    const fechado = abre => ({ aberto: false, texto: "Fechado · abre " + abre, abre, dia: a.dia });
    const depois = intervalos(a.dia).find(iv => iv.ini > a.min);
    if (depois) return fechado("hoje às " + depois.a);
    for (let i = 1; i <= 7; i++) {
      const d = (a.dia + i) % 7, ivs = intervalos(d);
      if (ivs.length) return fechado((i === 1 ? "amanhã" : DIAS[d].toLowerCase()) + " às " + ivs[0].a);
    }
    return { aberto: false, texto: "Fechado", abre: "", dia: a.dia };
  }
  const podePedir = () => status().aberto || R.aceitaPedidosFechado !== false;

  /* ---------- HERO ---------- */
  function renderHero() {
    const capa = $("#capa");
    if (R.capa) capa.innerHTML = '<img src="' + esc(R.capa) + '" alt="" width="1200" height="400" fetchpriority="high" decoding="async" onerror="this.remove()">';
    $("#logo").innerHTML = R.logo ? imgTag(R.logo, R.nome, 96, 96, true) : esc(iniciais(R.nome));
    $("#nome").textContent = R.nome;
    $("#descricao").textContent = R.descricao || "";
    const s = status(), el = $("#status");
    el.textContent = s.texto; el.classList.toggle("fechado", !s.aberto);
    const hoje = faixas(s.dia, "–");
    const partes = [];
    if (R.avaliacao) partes.push('<span><span class="nota">' + ICON.star + String(R.avaliacao.nota).replace(".", ",") + "</span>(" + R.avaliacao.total + " avaliações)</span>");
    if (R.tipo) partes.push("<span>" + esc(R.tipo) + "</span>");
    partes.push("<span>" + ICON.clock + (hoje.length ? "Hoje " + hoje.join(" · ") : "Fechado hoje") + "</span>");
    if (R.endereco) partes.push("<span>" + ICON.pin + esc(R.endereco) + "</span>");
    $("#meta").innerHTML = partes.join("");
    const acoes = [];
    if (R.mapa) acoes.push('<a class="btn primario" href="' + esc(R.mapa) + '" target="_blank" rel="noopener">' + ICON.pin + "Ver localização</a>");
    if (R.instagram && R.instagram.url) acoes.push('<a class="btn" href="' + esc(R.instagram.url) + '" target="_blank" rel="noopener">' + ICON.insta + esc(R.instagram.usuario || "Instagram") + "</a>");
    acoes.push('<a class="btn" href="' + esc(linkWhats(R.mensagemContato || "Olá! Vim pelo cardápio online.")) + '" target="_blank" rel="noopener">' + ICON.chat + "WhatsApp</a>");
    $("#acoes").innerHTML = acoes.join("");
  }

  /* ---------- controles de quantidade ---------- */
  const qtd = key => estado.itens[key] || 0;
  const qtdProduto = id => Object.keys(estado.itens).reduce((s, k) => s + (idDe(k) === id ? estado.itens[k] : 0), 0);
  const doCtrl = key => $$("[data-ctrl]").filter(el => el.dataset.ctrl === key);
  // key = id do produto (listagem) ou chave da linha (sacola)
  function ctrl(key) {
    const p = porId[idDe(key)]; if (!p) return "";
    if (!disponivel(p)) return '<span class="indisp">Indisponível</span>';
    if (key === p.id && temOpcoes(p)) {
      const n = qtdProduto(p.id);
      return '<button class="add" type="button" data-opcoes="' + esc(p.id) + '" aria-haspopup="dialog" aria-label="Escolher opções de ' + esc(p.nome) + (n ? " (" + n + " na sacola)" : "") + '">' + ICON.plus +
        (n ? '<span class="add-n" aria-hidden="true">' + n + "</span>" : "") + "</button>";
    }
    const q = qtd(key);
    if (!q) return '<button class="add" type="button" data-add="' + esc(key) + '" aria-label="Adicionar ' + esc(p.nome) + ' à sacola">' + ICON.plus + "</button>";
    return '<div class="stepper" role="group" aria-label="Quantidade de ' + esc(p.nome) + '">' +
      '<button type="button" data-dec="' + esc(key) + '" aria-label="Remover um ' + esc(p.nome) + '">' + (q === 1 ? ICON.trash : ICON.minus) + "</button>" +
      "<output>" + q + "</output>" +
      '<button type="button" data-add="' + esc(key) + '" aria-label="Adicionar mais um ' + esc(p.nome) + '"' + (q >= 99 ? " disabled" : "") + ">" + ICON.plus + "</button></div>";
  }
  const classesProd = p => (disponivel(p) ? "" : " indisponivel") + (disponivel(p) && temOpcoes(p) ? " tem-opcoes" : "");
  function badges(p) {
    const b = (p.badges || []).map(t => '<span class="badge ' + slug(t) + '">' + esc(t) + "</span>");
    if (temPromo(p)) b.unshift('<span class="badge oferta">−' + Math.round((1 - p.promo / p.preco) * 100) + "%</span>");
    return b.join("");
  }
  const precoHtml = p => temOpcoes(p) && precoMin(p) > precoDe(p)
    ? '<span class="preco"><span class="a-partir">a partir de</span><strong' + (temPromo(p) ? ' class="promo"' : "") + ">" + brl(precoMin(p)) + "</strong></span>"
    : temPromo(p)
    ? '<span class="preco"><s aria-label="De ' + brl(p.preco) + '">' + brl(p.preco) + '</s><strong class="promo" aria-label="Por ' + brl(p.promo) + '">' + brl(p.promo) + "</strong></span>"
    : '<span class="preco"><strong>' + brl(p.preco) + "</strong></span>";

  /* ---------- DESTAQUES: combo + mais pedidos ---------- */
  function renderDestaques() {
    let html = "";
    const d = R.destaqueSemana && porId[R.destaqueSemana.produto];
    if (d) {
      html += '<section class="combo' + classesProd(d) + '" data-produto="' + esc(d.id) + '" aria-labelledby="t-combo">' +
        '<div class="foto">' + (d.foto ? imgTag(d.foto, d.nome, 320, 240) : '<div class="ph" aria-hidden="true">' + esc(iniciais(d.nome)) + "</div>") + "</div>" +
        "<div><span class=\"rotulo\">" + esc(R.destaqueSemana.titulo || "Destaque") + '</span><h3 id="t-combo">' + esc(d.nome) + "</h3>" +
        "<p>" + esc(R.destaqueSemana.texto || d.descricao || "") + "</p>" +
        '<div class="linha-preco">' + precoHtml(d) + '<span class="ctrl" data-ctrl="' + d.id + '">' + ctrl(d.id) + "</span></div></div></section>";
    }
    const pop = produtos.filter(p => p.popular);
    if (pop.length) {
      html += '<section class="bloco" id="mais-pedidos" aria-labelledby="t-pop"><h2 id="t-pop">Mais pedidos</h2><p class="sub">Os favoritos de quem passa por aqui</p><div class="carrossel">' +
        pop.map(p => '<article class="card' + classesProd(p) + '" data-produto="' + esc(p.id) + '">' +
          '<div class="foto">' + (p.foto ? imgTag(p.foto, p.nome, 400, 300) : '<div class="ph" aria-hidden="true">' + esc(iniciais(p.nome)) + "</div>") + "</div>" +
          '<div class="info"><h3>' + esc(p.nome) + "</h3>" + precoHtml(p) + "</div>" +
          '<span class="ctrl" data-ctrl="' + p.id + '">' + ctrl(p.id) + "</span></article>").join("") +
        "</div></section>";
    }
    $("#destaques").innerHTML = html;
  }

  /* ---------- SEÇÕES ---------- */
  function linha(p) {
    const busca = norm([p.nome, p.descricao, (p.badges || []).join(" "), p._grupos.map(g => g.itens.map(i => i.nome).join(" ")).join(" ")].join(" "));
    return '<article class="prod' + classesProd(p) + '" data-produto="' + esc(p.id) + '" data-busca="' + esc(busca) + '">' +
      "<div><h3>" + esc(p.nome) + "</h3>" + (p.descricao ? '<p class="desc">' + esc(p.descricao) + "</p>" : "") +
      '<div class="badges">' + badges(p) + "</div>" + precoHtml(p) + "</div>" +
      '<div class="prod-lado' + (p.foto ? " com-foto" : "") + '">' + (p.foto ? '<div class="foto">' + imgTag(p.foto, p.nome, 208, 208) + "</div>" : "") +
      '<span class="ctrl" data-ctrl="' + p.id + '">' + ctrl(p.id) + "</span></div></article>";
  }
  function renderSecoes() {
    $("#secoes").innerHTML = R.categorias.map(cat => {
      const itens = produtos.filter(p => p.categoria === cat.id);
      if (!itens.length) return "";
      return '<section class="bloco cat" id="cat-' + esc(cat.id) + '" aria-labelledby="t-' + esc(cat.id) + '"><h2 id="t-' + esc(cat.id) + '">' + esc(cat.nome) + "</h2>" +
        '<p class="sub">' + itens.length + (itens.length === 1 ? " item" : " itens") + '</p><div class="lista">' + itens.map(linha).join("") + "</div></section>";
    }).join("");
  }

  /* ---------- CHIPS ---------- */
  const chipsDados = () => {
    const l = [];
    if (produtos.some(p => p.popular)) l.push({ alvo: "mais-pedidos", nome: "Mais pedidos" });
    R.categorias.forEach(cat => { if (produtos.some(p => p.categoria === cat.id)) l.push({ alvo: "cat-" + cat.id, nome: cat.nome }); });
    return l;
  };
  function renderChips() {
    $("#chips").innerHTML = chipsDados().map((c, i) => '<button class="chip" type="button" data-alvo="' + c.alvo + '" aria-current="' + (i === 0) + '">' + esc(c.nome) + "</button>").join("");
  }
  function marcarChip(alvo) {
    $$(".chip").forEach(b => {
      const on = b.dataset.alvo === alvo; b.setAttribute("aria-current", on);
      if (on) { const nav = $("#chips"); const l = b.offsetLeft - 16, r = b.offsetLeft + b.offsetWidth - nav.clientWidth + 16;
        if (nav.scrollLeft > l) nav.scrollTo({ left: l, behavior: reduzMovimento ? "auto" : "smooth" });
        else if (nav.scrollLeft < r) nav.scrollTo({ left: r, behavior: reduzMovimento ? "auto" : "smooth" }); }
    });
  }
  let travaChip = 0;
  function observarSecoes() {
    if (!("IntersectionObserver" in window)) return;
    const h = $("#sticky").offsetHeight;
    document.documentElement.style.setProperty("--sticky-h", h + "px");
    const obs = new IntersectionObserver(es => {
      if (Date.now() < travaChip || buscaAtiva()) return;
      const vis = es.filter(e => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
      if (vis) marcarChip(vis.target.id);
    }, { rootMargin: "-" + (h + 20) + "px 0px -55% 0px" });
    $$("#mais-pedidos, .cat").forEach(s => obs.observe(s));
  }

  /* ---------- BUSCA ---------- */
  const campo = $("#q");
  const buscaAtiva = () => campo.value.trim().length > 0;
  function aplicarBusca() {
    const q = norm(campo.value.trim());
    const termos = q.split(/\s+/).filter(Boolean);
    $("#limpar-busca").hidden = !termos.length;
    $("#destaques").hidden = termos.length > 0;
    let total = 0;
    $$(".cat").forEach(sec => {
      let n = 0;
      $$(".prod", sec).forEach(art => {
        const ok = !termos.length || termos.every(t => art.dataset.busca.includes(t));
        art.hidden = !ok; if (ok) n++;
      });
      sec.hidden = n === 0; total += n;
    });
    const vazio = $("#sem-resultado");
    if (termos.length && !total) {
      vazio.innerHTML = '<strong>Nada encontrado para “' + esc(campo.value.trim()) + '”</strong>Tente outro nome, como “café”, “pão de queijo” ou “vegano”.<br><button class="btn" type="button" data-limpar-busca>Ver cardápio completo</button>';
      vazio.hidden = false;
    } else vazio.hidden = true;
  }
  function limparBusca() { campo.value = ""; aplicarBusca(); campo.focus(); }

  /* ---------- SACOLA ---------- */
  const listaItens = () => Object.keys(estado.itens).filter(k => estado.itens[k] > 0 && linhaDe(k));
  const subtotal = () => arred(listaItens().reduce((s, k) => s + unitario(linhaDe(k)) * estado.itens[k], 0));
  const quantidade = () => listaItens().reduce((s, k) => s + estado.itens[k], 0);
  const entregaCfg = () => R.entrega || {};
  const bairros = () => { const e = entregaCfg(); return e.modo === "bairros" && Array.isArray(e.bairros) ? e.bairros.filter(b => b && b.nome && typeof b.taxa === "number") : []; };
  const porBairro = () => bairros().length > 0;
  const bairroAtual = () => bairros().find(b => b.nome === estado.bairro) || null;
  // taxa de entrega; null = falta escolher o bairro
  function taxa(sub) {
    if (estado.tipo !== "entrega") return 0;
    const e = entregaCfg();
    if (e.gratisAcima && sub >= e.gratisAcima) return 0;
    if (porBairro()) { const b = bairroAtual(); return b ? b.taxa : null; }
    return e.taxa || 0;
  }
  function redesenharCtrl(key) {
    const id = idDe(key);
    $$("[data-ctrl]").forEach(el => { if (el.dataset.ctrl === key || el.dataset.ctrl === id) el.innerHTML = ctrl(el.dataset.ctrl); });
  }

  function alterar(key, delta, origem) {
    const l = linhaDe(key); if (!l) return;
    const p = l.p;
    if (delta > 0 && !disponivel(p)) return;
    const novo = Math.min(99, Math.max(0, qtd(key) + delta));
    if (novo) estado.itens[key] = novo; else delete estado.itens[key];
    salvar();
    // lembra onde estava o foco para devolvê-lo após redesenhar (teclado/leitor de tela)
    const container = origem ? origem.closest("[data-ctrl]") : null;
    const noDialog = !!(origem && origem.closest("dialog"));
    const indice = container ? doCtrl(key).indexOf(container) : -1;
    redesenharCtrl(key);
    atualizarBarra();
    if ($("#sacola").open) renderSacolaDinamica();
    if (origem && document.activeElement === document.body || (origem && !document.contains(origem))) {
      const alvos = noDialog ? doCtrl(key).filter(el => el.closest("#sacola")) : doCtrl(key).filter(el => !el.closest("dialog"));
      const alvo = noDialog ? alvos[0] : (alvos[indice] || alvos[0]);
      const btn = alvo && (alvo.querySelector(delta > 0 ? "[data-add]" : "[data-dec]") || alvo.querySelector("[data-add]"));
      if (btn) btn.focus({ preventScroll: true });
      else if (noDialog) { const f = $("#sacola .fechar"); if (f) f.focus(); }
    }
    if (delta > 0) toast(p.nome + " adicionado à sacola");
    else if (!novo) toast(p.nome + " removido");
  }

  function atualizarBarra() {
    const n = quantidade();
    $("#barra").hidden = n === 0;
    $("#barra-qtd").textContent = n;
    $("#barra-total").textContent = brl(subtotal());
    $("#abrir-sacola").setAttribute("aria-label", "Ver sacola: " + n + (n === 1 ? " item" : " itens") + ", " + brl(subtotal()));
  }

  let t;
  function toast(msg) {
    const el = $("#toast"); el.textContent = msg; el.classList.add("on");
    clearTimeout(t); t = setTimeout(() => el.classList.remove("on"), 1600);
  }

  function renderSacola() {
    const corpo = $("#sacola-corpo"), rod = $("#sacola-rodape");
    if (!listaItens().length) {
      corpo.innerHTML = '<div class="sacola-vazia"><div class="circulo">' + ICON.bag + "</div><strong>Sua sacola está vazia</strong>Adicione itens do cardápio para montar o pedido.</div>";
      rod.innerHTML = '<button class="btn primario" type="button" data-fechar style="width:100%">Ver cardápio</button>';
      return;
    }
    const e = entregaCfg();
    corpo.innerHTML =
      '<div id="sacola-horario"></div>' +
      '<ul class="itens" id="sacola-itens"></ul>' +
      '<div class="campo"><span class="label" id="l-tipo">Como você quer receber?</span>' +
      '<div class="segmentado" role="radiogroup" aria-labelledby="l-tipo">' +
      '<input type="radio" name="tipo" id="tipo-retirada" value="retirada"' + (estado.tipo === "retirada" ? " checked" : "") + '><label for="tipo-retirada">Retirada</label>' +
      '<input type="radio" name="tipo" id="tipo-entrega" value="entrega"' + (estado.tipo === "entrega" ? " checked" : "") + '><label for="tipo-entrega">Entrega</label></div></div>' +
      '<div id="campo-endereco"' + (estado.tipo === "entrega" ? "" : " hidden") + ">" +
      (porBairro() ? '<div class="campo"><label for="bairro">Bairro</label><select id="bairro" aria-describedby="erro-bairro"><option value="">Selecione o bairro</option>' +
        bairros().map(b => '<option value="' + esc(b.nome) + '"' + (b.nome === estado.bairro ? " selected" : "") + ">" + esc(b.nome) + " — " + brl(b.taxa) + "</option>").join("") +
        '</select><div class="erro" id="erro-bairro" hidden></div></div>' : "") +
      '<div class="campo"><label for="endereco">Endereço de entrega</label>' +
      '<textarea id="endereco" rows="2" placeholder="Rua, número e complemento' + (porBairro() ? "" : " e bairro") + '" aria-describedby="erro-endereco">' + esc(estado.endereco) + '</textarea><div class="erro" id="erro-endereco" hidden></div>' +
      (e.aviso ? '<p class="nota-envio" style="text-align:left">' + esc(e.aviso) + "</p>" : "") + "</div></div>" +
      '<div class="campo"><label for="obs">Observação (opcional)</label><textarea id="obs" rows="2" placeholder="Ex.: sem açúcar no cappuccino">' + esc(estado.obs) + "</textarea></div>" +
      '<div class="resumo" id="sacola-resumo" aria-live="polite"></div>' +

      porBairro() ? "Taxa por bairro: " + bairros().map(b => b.nome + " " + brl(b.taxa)).join(" · ") + "." : e.taxa ? "Taxa de entrega: " + brl(e.taxa) + "." : "",
      e.gratisAcima ? "Grátis em pedidos acima de " + brl(e.gratisAcima) + "." : "",
      e.pedidoMinimo ? "Pedido mínimo para entrega: " + brl(e.pedidoMinimo) + "." : "",
      e.aviso || ""
    ].filter(Boolean).join(" ");
    $("#informacoes").innerHTML = '<h2 id="t-info">Informações</h2><p class="sub">Tudo o que você precisa saber antes de pedir ou visitar</p><div class="info-grid">' +
      '<div class="info-card"><h3>' + ICON.clock + 'Horários</h3><ul class="horarios">' + hs + "</ul></div>" +
      '<div class="info-card"><h3>' + ICON.pin + "Endereço e contato</h3><p>" + esc(R.endereco || "") + "</p>" +
        (R.mapa ? '<p><a class="link" href="' + esc(R.mapa) + '" target="_blank" rel="noopener">Ver no mapa</a></p>' : "") +
        (R.telefone ? '<p>' + ICON.phone.replace('class="icon"', 'class="icon" style="vertical-align:-3px;margin-right:6px"') + '<a class="link" href="tel:' + esc(String(R.telefone).replace(/[^\d+]/g, "")) + '">' + esc(R.telefone) + "</a></p>" : "") +
        (R.instagram && R.instagram.url ? '<p>' + ICON.insta.replace('class="icon"', 'class="icon" style="vertical-align:-3px;margin-right:6px"') + '<a class="link" href="' + esc(R.instagram.url) + '" target="_blank" rel="noopener">' + esc(R.instagram.usuario || "Instagram") + "</a></p>" : "") +
      "</div>" +
      '<div class="info-card"><h3>' + ICON.card + 'Pagamento</h3><div class="pagamentos">' + (R.pagamentos || []).map(p => "<span>" + esc(p) + "</span>").join("") + "</div>" +
        '<h3 style="margin-top:16px">' + ICON.truck + "Entrega</h3><p>" + esc(entregaTxt) + "</p></div>" +
      '<div class="info-card qr"><div class="qr-topo"><div><h3>' + ICON.qr + "QR Code do cardápio</h3><p>Para imprimir e colocar nas mesas, no balcão ou nas embalagens.</p></div>" +
        '<button class="btn" type="button" id="qr-mostrar" aria-expanded="false" aria-controls="qr-area">Mostrar QR Code</button></div>' +
        '<div class="qr-area" id="qr-area" hidden></div></div>' +
      "</div>";
    $("#rodape").innerHTML = esc(R.rodape || "") + "<br>Cardápio online de " + esc(R.nome) + ".";
  }

  /* ---------- eventos ---------- */
  document.addEventListener("click", ev => {
    const el = ev.target.closest("button, a");
    if (!el) {
      // tocar no card de um produto com opções também abre o modal
      const art = ev.target.closest("[data-produto]"), p = art && porId[art.dataset.produto];
      if (p && temOpcoes(p) && disponivel(p) && !ev.target.closest("label, input, select, textarea")) abrirOpcoes(p.id, $("[data-opcoes]", art));
      return;
    }
    if (el.disabled) return;
    if (el.dataset.opcoes) { abrirOpcoes(el.dataset.opcoes, el); return; }
    if (el.dataset.opQ) { if (op) { op.q = Math.max(1, Math.min(99, op.q + Number(el.dataset.opQ))); atualizarOpcoes(); } return; }
    if (el.id === "op-confirmar") { if (op) confirmarOpcoes(); return; }
    if (el.id === "fechar-opcoes") { fecharOpcoes(); return; }
    if (el.id === "qr-mostrar") { alternarQr(); return; }
    if (el.dataset.add) { alterar(el.dataset.add, 1, el); return; }
    if (el.dataset.dec) { alterar(el.dataset.dec, -1, el); return; }
    if (el.dataset.remover) { alterar(el.dataset.remover, -qtd(el.dataset.remover), el); return; }
    if (el.hasAttribute("data-esvaziar")) { estado.itens = {}; estado.obs = ""; salvar(); $$("[data-ctrl]").forEach(c => { c.innerHTML = ctrl(c.dataset.ctrl); }); atualizarBarra(); renderSacola(); return; }
    if (el.hasAttribute("data-fechar")) { fecharSacola(); return; }
    if (el.hasAttribute("data-limpar-busca")) { limparBusca(); return; }
    if (el.dataset.alvo) {
      const sec = document.getElementById(el.dataset.alvo);
      if (buscaAtiva()) { campo.value = ""; aplicarBusca(); }
      if (sec) { travaChip = Date.now() + 900; marcarChip(el.dataset.alvo); sec.scrollIntoView({ behavior: reduzMovimento ? "auto" : "smooth", block: "start" }); }
      return;
    }
    if (el.id === "abrir-sacola") { abrirSacola(); return; }
    if (el.id === "fechar-sacola") { fecharSacola(); return; }
    if (el.id === "limpar-busca") { limparBusca(); return; }
    if (el.id === "enviar") { enviar(); return; }
  });
  document.addEventListener("change", ev => {
    if (ev.target.name === "tipo") {
      estado.tipo = ev.target.value === "entrega" ? "entrega" : "retirada"; salvar();
      $("#campo-endereco").hidden = estado.tipo !== "entrega";
      const erro = $("#erro-endereco"); if (erro) erro.hidden = true;
      renderSacolaDinamica();
      return;
    }
    if (ev.target.id === "bairro") {
      estado.bairro = ev.target.value; salvar();
      ev.target.removeAttribute("aria-invalid"); const er = $("#erro-bairro"); if (er) er.hidden = true;
      renderSacolaDinamica();
      return;
    }
    if (op && ev.target.dataset && ev.target.dataset.g != null) {
      const gi = +ev.target.dataset.g, ii = +ev.target.value, g = op.p._grupos[gi];
      if (g.obrigatorio) op.sel[gi] = [ii];
      else op.sel[gi] = ev.target.checked ? op.sel[gi].concat(ii) : op.sel[gi].filter(x => x !== ii);
      const fs = $("#grupo-" + gi, dlgOp); if (fs) { fs.classList.remove("invalido"); $("#erro-grupo-" + gi, dlgOp).hidden = true; }
      atualizarOpcoes();
    }
  });
  document.addEventListener("input", ev => {
    if (ev.target === campo) { aplicarBusca(); return; }
    if (ev.target.id === "endereco") {
      estado.endereco = ev.target.value; salvar();
      if (ev.target.value.trim()) { ev.target.removeAttribute("aria-invalid"); const er = $("#erro-endereco"); if (er) er.hidden = true; }
    }
    if (ev.target.id === "obs") { estado.obs = ev.target.value; salvar(); }
  });
  campo.addEventListener("keydown", ev => { if (ev.key === "Escape" && campo.value) { ev.preventDefault(); limparBusca(); } });

  /* ---------- início ---------- */
  renderHero();
  renderDestaques();
  renderSecoes();
  renderChips();
  renderInfo();
  atualizarBarra();
  observarSecoes();
  window.addEventListener("resize", () => document.documentElement.style.setProperty("--sticky-h", $("#sticky").offsetHeight + "px"));
  setInterval(() => { const s = status(), el = $("#status"); el.textContent = s.texto; el.classList.toggle("fechado", !s.aberto); atualizarHorarioSacola(); }, 60000);

  // usado nos testes: expõe a mensagem gerada (sem abrir o WhatsApp), a configuração e um relógio simulado
  function atualizarTudo() {
    renderHero(); renderDestaques(); renderSecoes(); aplicarBusca(); renderInfo(); atualizarBarra();
    if (dlg.open) renderSacola();
  }
  window.__cardapio = {
    mensagem, estado: () => estado, config: R, atualizar: atualizarTudo, qrMatriz,
    simularHorario(dia, hhmm) { relogio = dia == null ? null : { dia, min: minutos(hhmm) }; atualizarTudo(); return status(); }
  };
})();
</script>
</body>
</html>
